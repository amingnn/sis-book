name: 打包 windows 安装器

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # 构建前端
  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      
      - uses: pnpm/action-setup@v5
        with:
          version: latest

      - name: 安装前端依赖并构建
        working-directory: frontend
        run: pnpm install --frozen-lockfile && pnpm run build

      - name: 上传前端构建产物
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: frontend/dist

  # 构建后端
  build-installer:
    runs-on: windows-latest
    needs: build-frontend
    steps:
      - uses: actions/checkout@v6

      - name: 下载前端构建产物
        uses: actions/download-artifact@v7
        with:
          name: frontend-dist
          path: frontend/dist

      - name: 安装 uv
        uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57

      - name: 安装后端依赖并用 PyInstaller 打包
        working-directory: backend
        run: |
          uv sync
          uv pip install pyinstaller
          uv run pyinstaller ../build/sis-book.spec --noconfirm --distpath ../dist

      # 打包安装器
      - name: 安装 Inno Setup
        run: choco install innosetup -y --no-progress

      - name: 构建安装包
        run: iscc build/installer.iss /DMyAppVersion="${{ github.ref_name }}"

      # 发布到 GitHub Release 
      - name: 发布到 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/installer/mucheng-book_Setup.exe
          generate_release_notes: true  
