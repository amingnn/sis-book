name: 打包 windows 安装器

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # 构建前端
  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      
      - uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile && pnpm run build

      - name: Upload fronted dist
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

  # 构建后端
  build-installer:
    runs-on: windows-latest
    needs: build-frontend
    steps:
      - uses: actions/checkout@v4

      - name: Download frontend dist
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Setup uv
        uses: astral-sh/setup-uv@v4

      - name: Install backend dependencies && Build with PyInstaller
        working-directory: backend
        run: |
          uv sync
          uv pip install pyinstaller
          uv run pyinstaller ../build/sis-book.spec --noconfirm --distpath ../dist

      # 打包安装器
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build installer
        run: iscc build/installer.iss /DMyAppVersion="${{ github.ref_name }}"

      # 发布到 GitHub Release 
      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/installer/mucheng-book_Setup.exe
          generate_release_notes: true  
